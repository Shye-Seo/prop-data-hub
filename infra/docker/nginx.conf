server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 해시가 붙은 자산은 길게 캐시한다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 해시 라우팅을 쓰므로 모든 경로를 index.html로 보낸다.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
